<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Jadwal Operasional Seafood Bahari</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: #17191d;

            background-color: #e9edef;
            background-image:
                linear-gradient(35deg,
                    transparent 48%, #fff 49%,
                    #fff 50%, transparent 51%),
                linear-gradient(145deg,
                    transparent 48%, #d5dadd 49%,
                    #d5dadd 50%, transparent 51%);

            background-size: 180px 190px;
        }

        header {
            text-align: center;
            padding: 30px 15px 20px;
        }

        .logo {
            font-size: 100px;
            margin-bottom: 15px;
        }

        nav {
            font-size: 19px;
            margin-top: 15px;
        }

        nav a {
            color: #57258c;
            margin: 0 3px;
        }

        hr {
            margin: 25px 5%;
            border: none;
            border-top: 1px solid #888;
        }

        main {
            padding: 0 5% 35px;
        }

        h1 {
            font-size: 30px;
            font-weight: normal;
            margin: 40px 0 48px;
        }

        table {
            width: 100%;
            max-width: 310px;
            border-collapse: collapse;
            background: rgba(255, 255, 255, 0.82);
            font-size: 20px;
        }

        th, td {
            border: 1px solid #222;
            padding: 16px 14px;
            text-align: left;
            line-height: 1.8;
        }

        th {
            font-weight: normal;
        }

        .catatan {
            font-style: italic;
        }

        footer {
            text-align: center;
            color: #777;
            font-size: 15px;
            margin: 55px 10px 30px;
        }
    </style>
</head>

<body>

<header id="beranda">

    <div class="logo">🦐</div>

    <nav>
        <a href="index.html">Beranda</a> |
        <a href="index.html">menu makanan seafood</a>
    </nav>

</header>

<hr>

<main>
    <h1 id="jadwal">jadwal operasional</h1>
    <table>
        <tr>
            <th>Hari</th>
            <th>Jam Buka</th>
        </tr>

        <tr>
            <td>Senin - Jumat</td>
            <td>10.00 - 22.00</td>
        </tr>

        <tr>
            <td>Sabtu - Minggu</td>
            <td>10.00 - 23.00</td>
        </tr>

        <tr>
            <td colspan="2" class="catatan">
                Format waktu dalam WIB
            </td>
        </tr>
    </table>
</main>

<footer>
    Created by Adi @2026
</footer>

</body>
</html>

  
</body>

</html>
